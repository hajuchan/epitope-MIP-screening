name: GROMACS
channels:
  - conda-forge
  - bioconda
  - hcc
  - defaults

dependencies:
  # ── Core ──
  - python>=3.10,<3.14
  - pip
  - setuptools

  # ── Cheminformatics ──
  - rdkit>=2025.03         # molecular structure, fingerprints, 3D embedding
  - ambertools             # GAFF2 parameters (antechamber, tleap, sqm)
  - openbabel>=3.1         # PDBQT/mol2 format conversion

  # ── Docking (CPU) ──
  - autodock>=4.2.6        # AutoDock4 LGA docking (bioconda)
  - autogrid>=4.2.6        # AutoGrid4 grid map generation (bioconda)
  - adfr-suite             # prepare_receptor4, prepare_ligand4 (hcc)

  # ── Structure Preparation ──
  - openmm>=8.0            # pdbfixer dependency
  - pdbfixer               # fix missing atoms/residues in PDB

  # ── Bioinformatics ──
  - biopython>=1.86        # PDB download, sequence analysis, BLAST

  # ── Numerical / Visualization ──
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7

  # ── pip packages ──
  - pip:
    # Docking
    - meeko>=0.7            # PDBQT conversion (AutoDock4 compatible)
    - gemmi>=0.7            # meeko dependency (crystal structure handling)

    # MD parameterization & analysis
    - acpype>=2023.10       # GAFF2 parameterization (GROMACS topology)
    - mdanalysis>=2.5       # trajectory analysis, contact frequency
    - tqdm                  # progress bars (gmx_MMPBSA dependency)

    # Structure preparation
    - propka>=3.5           # pH 7.4 protonation state prediction

# ══════════════════════════════════════════════════════════════
# Post-install steps (not automated by conda)
# ══════════════════════════════════════════════════════════════
#
# 1. Create environment:
#    conda env create -f environment.yml
#    conda activate GROMACS
#
# 2. GROMACS GPU (required, build from source for GPU support):
#    # Download: https://manual.gromacs.org/current/download.html
#    # Build with CUDA:
#    mkdir build && cd build
#    cmake .. -DGMX_GPU=CUDA -DCMAKE_INSTALL_PREFIX=/usr/local/gromacs-gpu
#    make -j$(nproc) && sudo make install
#    # Verify: /usr/local/gromacs-gpu/bin/gmx --version
#    #
#    # Alternative (CPU only, not recommended):
#    #   sudo apt install gromacs
#    #   conda install -c conda-forge gromacs
#    #
#    # config.py GMX_BIN must point to the correct gmx binary.
#
# 3. AutoDock-GPU (required for Phase 2/3, ~100-350x faster):
#    # Build from source (requires CUDA toolkit):
#    git clone https://github.com/ccsb-scripps/AutoDock-GPU.git
#    cd AutoDock-GPU && make DEVICE=GPU
#    # Add to PATH: export PATH=$PWD/bin:$PATH
#    # Verify: autodock_gpu_128wi --version
#    #
#    # Pipeline auto-detects GPU binary; falls back to AD4 CPU if unavailable.
#
# 4. gmx_MMPBSA (optional, for binding free energy):
#    # Requires system Python (not conda) due to AmberTools dependency:
#    pip install gmx_MMPBSA
#    # Note: gmx_MMPBSA runs via system python shebang, not conda python.
#
# 5. Verify installation:
#    autodock4 --version
#    autogrid4 --version
#    autodock_gpu_128wi --version
#    /usr/local/gromacs-gpu/bin/gmx --version
#    python -c "from rdkit import Chem; print('RDKit OK')"
#    python -c "import MDAnalysis; print('MDAnalysis OK')"
#    python -c "import propka; print('PROPKA OK')"
#    python -c "import acpype; print('acpype OK')"
#    python -c "import pdbfixer; print('pdbfixer OK')"
#    python -c "import meeko; print('meeko OK')"
#
# ══════════════════════════════════════════════════════════════
# Architecture Notes
# ══════════════════════════════════════════════════════════════
#
# GPU Requirements:
#   - NVIDIA GPU with CUDA support (tested: RTX 4070 Ti, 12GB VRAM)
#   - CUDA toolkit >= 11.0
#   - GROMACS GPU: Phase 1/4 MD (~5-10x speedup)
#   - AutoDock-GPU: Phase 2/3 docking (~100-350x speedup)
#
# Si/B Atom Handling:
#   - Silane monomers (Si): PolCA force field (Jorge et al. 2021)
#   - Boronic acid (B, APBA): UFF-based custom AD4 parameters
#   - acpype/GAFF2 cannot handle Si/B → automatic PolCA fallback
#   - AutoDock4: Si→S, B→C proxy substitution for PDBQT generation
#
# ADFR Suite:
#   - Installs internal Python 2.7 for prepare_receptor4.py
#   - Does NOT affect conda Python 3 environment
#   - Pipeline calls via explicit python2.7 path
#
# Tested Configuration:
#   - OS: Ubuntu 22.04 (WSL2) / Linux 6.6
#   - Python: 3.13.5
#   - GROMACS: 2025.2 (GPU build)
#   - AutoDock-GPU: v1.6
#   - GPU: NVIDIA RTX 4070 Ti (12GB)
